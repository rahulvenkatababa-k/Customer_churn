apiVersion: apps/v1

kind: Deployment

metadata:
  name: customer-churn-streamlit

spec:
  replicas: 1

  selector:
    matchLabels:
      app: customer-churn-streamlit

  template:
    metadata:
      labels:
        app: customer-churn-streamlit

    spec:
      containers:
      - name: customer-churn-streamlit
        image: ghcr.io/rahulvenkatababa-k/customer-churn-streamlit:latest

        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          timeoutSeconds: 5
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3

        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3

        envFrom:
          - configMapRef:
              name: customer-churn-streamlit-config

        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8501
    
