apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: customer-churn-ingress
  labels:
    app.kubernetes.io/name: customer-churn-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: customer-churn-streamlit
              port: 
                number: 8501
