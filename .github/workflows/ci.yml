name: Customer Churn CI

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - main
permissions:
  contents: read
  packages: write

jobs:
  test:
    environment: development

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      POSTGRES_SQL_URI: ${{ secrets.POSTGRES_SQL_URI }}
      MODEL_NAME: ${{ secrets.MODEL_NAME}}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: pytest -v tests/

      - name: Build API Docker Image
        run: docker build -f Dockerfile -t customer-churn-api:test .

      - name: Build Streamlit Docker Image
        run: docker build -f Dockerfile.streamlit -t customer-churn-streamlit:test .

  publish-images:
    name: Publish Docker Images to GHCR
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Login to Github GHCR
        env:
          REGISTRY_USERNAME: ${{github.actor}}
          REGISTRY_TOKEN: ${{secrets.GHCR_PAT}}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
      - name: Build API Image
        run: |
          docker build \
            -f Dockerfile \
            -t ghcr.io/rahulvenkatababa-k/customer-churn-api:${GITHUB_SHA} \
            -t ghcr.io/rahulvenkatababa-k/customer-churn-api:latest \
            .
      - name: Build Streamlit Image
        run: |
          docker build \
            -f Dockerfile.streamlit \
            -t ghcr.io/rahulvenkatababa-k/customer-churn-streamlit:${GITHUB_SHA} \
            -t ghcr.io/rahulvenkatababa-k/customer-churn-streamlit:latest \
            .
      - name: Push API IMAGE
        run: |
          docker push ghcr.io/rahulvenkatababa-k/customer-churn-api:${GITHUB_SHA}
          docker push ghcr.io/rahulvenkatababa-k/customer-churn-api:latest

      - name: Push Streamlit Image
        run: |
          docker push ghcr.io/rahulvenkatababa-k/customer-churn-streamlit:${GITHUB_SHA}
          docker push ghcr.io/rahulvenkatababa-k/customer-churn-streamlit:latest

      - name: Log Out from GitHub Container Registry
        if: always()
        run: |
          docker logout ghcr.io