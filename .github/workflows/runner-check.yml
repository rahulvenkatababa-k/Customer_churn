
name: Self-hosted Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Runner Identity
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          Write-Host "Runner user:"
          whoami
          Write-Host "Runner workspace:"
          Write-Host $env:GITHUB_WORKSPACE

      - name: Check kubectl
        shell: cmd
        run: |
          "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" version --client
          "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" --kubeconfig="C:\Users\lokes\.kube\config" config current-context
          "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" --kubeconfig="C:\Users\lokes\.kube\config" get nodes

      - name: Check Helm
        shell: cmd
        run: |
          "C:\Users\lokes\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64\helm.exe" version
