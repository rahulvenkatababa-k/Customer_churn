
name: Self-hosted Runner Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Runner Identity
        shell: powershell -ExecutionPolicy Bypass -File "{0}"
        run: |
          Write-Host "Runner user:"
          whoami
          Write-Host "Runner workspace:"
          Write-Host $env:GITHUB_WORKSPACE

      - name: Check kubectl
        shell: cmd
        run: |
          whoami
          where kubectl
          kubectl version --client
          kubectl config current-context
          kubectl get nodes

      - name: Check Helm
        shell: cmd
        run: |
          where helm
          helm version
          helm list
