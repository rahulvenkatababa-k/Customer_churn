name: customer churn CD

on:
    workflow_run:
        workflows: [ "Customer Churn CI" ]
        types: [completed]
        branches: [main]

permissions: 
    contents: read

jobs:
    deploy:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: [self-hosted, Windows, X64]

        steps:
            - name: Checkout Sucessful CI Commit
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Deploy With Helm
              shell: powershell -ExecutionPolicy Bypass -File "{0}"
              env:
                IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
              run: |
                $helm = "C:\Users\lokes\AppData\Local\Microsoft\WinGet\Packages\Helm.Helm_Microsoft.Winget.Source_8wekyb3d8bbwe\windows-amd64\helm.exe"
                $kubeconfig = "C:\Users\lokes\.kube\config"

                & $helm --kubeconfig $kubeconfig upgrade --install customer-churn helm/customer-churn `
                    --namespace default `
                    --wait `
                    --timeout 5m `
                    --set-string "api.image.tag=$env:IMAGE_TAG" `
                    --set-string "streamlit.image.tag=$env:IMAGE_TAG"
                if ($LASTEXITCODE -ne 0) {
                    throw "Helm deployment failed with exit code $LASTEXITCODE"
                } 

            - name: Verify API Rollout
              shell: cmd
              run: |
                "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" --kubeconfig="C:\Users\lokes\.kube\config" rollout status deployment/customer-churn-api -n default --timeout=180s
                if errorlevel 1 exit /b 1

            - name: Verify Streamlit Rollout
              shell: cmd
              run: |
                "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" --kubeconfig="C:\Users\lokes\.kube\config" rollout status deployment/customer-churn-streamlit -n default --timeout=180s
                if errorlevel 1 exit /b 1

            - name: Verify Running Pods
              shell: cmd
              run: |
                "C:\Users\lokes\AppData\Local\Programs\DockerDesktop\resources\bin\kubectl.exe" --kubeconfig="C:\Users\lokes\.kube\config" get pods -n default