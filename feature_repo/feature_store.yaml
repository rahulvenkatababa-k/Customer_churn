project: NetworkSecurity
registry:
  path: data/registry.db
provider: local

online_store:
  type: sqlite
  path: data/online_store.db

offline_store:
  type: postgres
  host: localhost
  port: 5432
  database: NetworkSecurity
  db_schema: public
  user: postgres
  password: <SET_VIA_ENV_OR_LOCAL_CONFIG>
  sslmode: disable
