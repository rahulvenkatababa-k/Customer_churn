
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-streamlit
  labels:
    app: customer-churn-streamlit
spec:
  type: {{ .Values.streamlit.service.type }}
  selector:
    app: customer-churn-streamlit
  ports:
    - protocol: TCP
      port: {{ .Values.streamlit.service.port }}
      targetPort: 8501
