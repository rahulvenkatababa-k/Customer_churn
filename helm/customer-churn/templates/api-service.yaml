apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name}}-api
    labels:
        app: customer-churn-api
spec:
    type: {{.Values.api.service.type}}
    selector:
        app: customer-churn-api
    ports:
        - name: http
          protocol: TCP
          port: {{.Values.api.service.port}}
          targetPort: 8000
          