
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-api
  labels:
    release: monitoring
    app: customer-churn-api
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: customer-churn-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
